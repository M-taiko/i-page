<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline - i-Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff, #f9fafb);
            padding: 1rem;
            text-align: center;
            color: #1f2937;
        }
        .card { max-width: 340px; }
        img { width: 72px; height: 72px; margin-bottom: 1.5rem; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; color: #6b7280; margin-bottom: 1.5rem; }
        button {
            background: #2563eb; color: white; border: none; padding: 0.75rem 2rem;
            border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/pwa/icon-192.png" alt="i-Page">
        <h1>You're offline</h1>
        <p>Check your connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
